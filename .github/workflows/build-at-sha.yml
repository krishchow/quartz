name: Build and Push Generated Files at SHA

on:
  workflow_dispatch:
    inputs:
      content_sha:
        description: 'The SHA of the content submodule to build against'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        token: ${{ secrets.GH_TOKEN }}

    - name: Update content submodule to specified SHA
      run: |
        cd content
        git fetch origin
        git checkout ${{ inputs.content_sha }}
        cd ..

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build with Quartz
      run: npx quartz build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Push SHA-specific files to S3
      run: |
        SHA="${{ inputs.content_sha }}"
        find ./public -type f -name "*+${SHA}*" | while read -r file; do
          s3_path="${file#./public/}"
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${s3_path}"
        done
